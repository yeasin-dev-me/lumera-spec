      x-required-permission: content.read
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Create a promotional campaign
      operationId: createAdminCampaign
      security:
        - cmsBearerAuth: []
      x-required-permission: content.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/campaigns/{public_id}/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Retrieve campaign details
      operationId: getAdminCampaignDetail
      security:
        - cmsBearerAuth: []
      x-required-permission: content.read
      responses:
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Update a campaign
      operationId: updateAdminCampaign
      security:
        - cmsBearerAuth: []
      x-required-permission: content.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/notifications/:
    get:
      tags: [admin]
      summary: List operational notification delivery history
      operationId: listAdminNotifications
      security:
        - cmsBearerAuth: []
      x-required-permission: notifications.read
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, sent, failed] }
        - name: event_type
          in: query
          schema: { type: string }
        - name: recipient
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string, enum: [email, sms] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated notification list
          content:
            application/json:
              schema:
                type: object
                required: [count, results]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminNotification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/notifications/{public_id}/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Retrieve operational notification delivery details
      operationId: getAdminNotificationDetail
      security:
        - cmsBearerAuth: []
      x-required-permission: notifications.read
      responses:
        "200":
          description: Notification details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/notifications/{public_id}/resend/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Idempotently resend or retry delivery for a notification
      operationId: resendAdminNotification
      security:
        - cmsBearerAuth: []
      x-required-permission: notifications.manage
      responses:
        "200":
          description: Resend attempt completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer access token (audience storefront). Proposed in ADR-0003 (pending approval).
    cmsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: CMS access token (audience cms). Accepted only under /admin/. Proposed in ADR-0009 (pending approval). Authorization is by permission, resolved server-side.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Provider-specific signature verification for /internal/ webhooks (details per provider, ADR-0005).

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Ordering:
      name: ordering
      in: query
      description: Field name; prefix with `-` for descending. Allowed fields are defined per endpoint.
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    ProductPublicId:
      name: product_id
      in: path
      required: true
      description: Product `public_id` (UUID). A malformed value yields the canonical JSON 404.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      description: Optimistic concurrency token (ETag / updated_at) for admin updates; stale value yields 409 conflict.
      schema: { type: string }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              examples: [validation_error, not_authenticated, permission_denied, not_found, conflict, insufficient_stock, product_unavailable, invalid_state_transition, throttled]
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    PaginatedBase:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer }
        next: { type: [string, "null"], format: uri }
        previous: { type: [string, "null"], format: uri }
        results: { type: array, items: {} }
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Decimal amount as string, 2 fraction digits.
      examples: ["19.90"]
    SecretFieldStatus:
      type: object
      description: Representation of a secret configuration value in ANY response. The value is never returned.
      required: [is_set]
      properties:
        is_set: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    PermissionList:
      type: array
      description: Permission codes (resource.action), e.g. products.write. Advisory for UI gating; the backend re-checks every request.
      items: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' }
    User:
      type: object
      required: [id, email, is_active, is_staff]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        is_active: { type: boolean }
        is_staff: { type: boolean }
        created_at: { type: string, format: date-time }
    CustomerProfile:
      type: object
      required: [id, email, is_active, is_staff, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, readOnly: true }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        is_active: { type: boolean, readOnly: true }
        is_staff: { type: boolean, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
    CustomerProfileUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        first_name: { type: string, maxLength: 150 }
        last_name: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 32 }
    CustomerAddress:
      type: object
      required: [id, label, full_name, phone, address_line1, address_line2, area, city, postal_code, country, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        full_name: { type: string }
        phone: { type: string }
        address_line1: { type: string }
        address_line2: { type: string }
        area: { type: string }
        city: { type: string }
        postal_code: { type: string }
        country: { type: string }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomerAddressInput:
      type: object
      required: [full_name, phone, address_line1, city, country]
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 64 }
        full_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        address_line1: { type: string, maxLength: 255 }
        address_line2: { type: string, maxLength: 255 }
        area: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        postal_code: { type: string, maxLength: 20 }
        country: { type: string, maxLength: 100, default: Bangladesh }
        is_default: { type: boolean, default: false }
    CustomerAddressUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, maxLength: 64 }
        full_name: { type: string, maxLength: 255 }
        phone: { type: string, maxLength: 50 }
        address_line1: { type: string, maxLength: 255 }
        address_line2: { type: string, maxLength: 255 }
        area: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        postal_code: { type: string, maxLength: 20 }
        country: { type: string, maxLength: 100 }
        is_default: { type: boolean }
    ReturnRequestItem:
      type: object
      required: [order_item_id, product_name, quantity]
      properties:
        order_item_id: { type: string }
        product_name: { type: string }
        quantity: { type: integer, minimum: 1 }
    ReturnRequest:
      type: object
      required: [public_id, order_public_id, reason, status, staff_note, items, created_at]
      properties:
        public_id: { type: string, format: uuid }
        order_public_id: { type: string, format: uuid }
        reason: { type: string }
        status: { type: string, enum: [requested, approved, rejected, received, cancelled] }
        staff_note: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReturnRequestItem" }
        created_at: { type: string, format: date-time }
    ReturnRequestCreate:
      type: object
      required: [order_public_id, reason, items]
      properties:
        order_public_id: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [order_item_id, quantity]
            properties:
              order_item_id: { type: integer }
              quantity: { type: integer, minimum: 1 }
    OrderReport:
      type: object
      required: [orders_count, paid_orders_count, gross_sales, refunded_total, currency]
      properties:
        orders_count: { type: integer }
        paid_orders_count: { type: integer }
        gross_sales: { $ref: "#/components/schemas/Money" }
        refunded_total: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
    Refund:
      type: object
      required: [public_id, payment_public_id, order_public_id, amount, currency, status, reason, created_at]
      properties:
        public_id: { type: string, format: uuid }
        payment_public_id: { type: string, format: uuid }
        order_public_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    RefundCreate:
      type: object
      required: [payment_public_id, amount]
      properties:
        payment_public_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        reason: { type: string, maxLength: 255 }

    StaffUser:
      type: object
      required: [id, email, is_staff, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        is_staff: { type: boolean }
        permissions: { $ref: "#/components/schemas/PermissionList" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access: { type: string }
        refresh: { type: string }
        user: { $ref: "#/components/schemas/User" }

    StaffAuthResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access: { type: string }
        refresh: { type: string }
        user: { $ref: "#/components/schemas/StaffUser" }

    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh: { type: string }

    TokenRefreshResponse:
      type: object
      required: [access]
      properties:
        access: { type: string }
        refresh: { type: string }

    LogoutRequest:
      type: object
      properties:
        refresh: { type: string }

    TrackingEvent:
      type: object
      description: Provider-neutral tracking event (ADR-0010). Client-sent events are non-authoritative.
      required: [event_id, event_name]
      properties:
        event_id: { type: string, format: uuid, description: Used for browser/server deduplication }
        event_name:
          type: string
          enum: [view_content, view_category, search, add_to_cart, remove_from_cart, initiate_checkout, add_payment_info, sign_up]
    Category:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image_url: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        sort_order: { type: integer }
        seo_title: { type: string }
        seo_description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoryCreateUpdateRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image_url: { type: string }
        status: { type: string, enum: [draft, active, archived], default: active }
        sort_order: { type: integer, default: 0 }
        seo_title: { type: string }
        seo_description: { type: string }

    ProductImage:
      type: object
      required: [id, image_url, is_primary]
      properties:
        id: { type: integer }
        image_url: { type: string }
        alt_text: { type: string }
        sort_order: { type: integer }
        is_primary: { type: boolean }

    ProductListItem:
      type: object
      required: [id, public_id, name, slug, sku, category, price, effective_price, stock_quantity, is_in_stock, status, is_visible]
      properties:
        id: { type: integer }
        public_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        category:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        discount_price: { type: [string, "null"] }
        effective_price: { $ref: "#/components/schemas/Money" }
        stock_quantity: { type: integer }
        is_in_stock: { type: boolean }
        status: { type: string, enum: [draft, active, archived] }
        is_visible: { type: boolean }
        is_featured: { type: boolean }
        sort_order: { type: integer }
        primary_image: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductListItem"
        - type: object
          properties:
            description: { type: string }
            seo_title: { type: string }
            seo_description: { type: string }
            images:
              type: array
              items:
                $ref: "#/components/schemas/ProductImage"
            updated_at: { type: string, format: date-time }

    ProductCreateUpdateRequest:
      type: object
      required: [name, slug, sku, category_id, price]
      properties:
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        category_id: { type: integer }
        description: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        discount_price: { type: [string, "null"] }
        stock_quantity: { type: integer, minimum: 0, default: 0 }
        status: { type: string, enum: [draft, active, archived], default: draft }
        is_visible: { type: boolean, default: true }
        is_featured: { type: boolean, default: false }
        sort_order: { type: integer, default: 0 }
        seo_title: { type: string }
        seo_description: { type: string }
        images:
          type: array
          items:
            type: object
            required: [image_url]
            properties:
              image_url: { type: string }
              alt_text: { type: string }
              sort_order: { type: integer }
              is_primary: { type: boolean }

    PaginatedProductList:
      allOf:
        - $ref: "#/components/schemas/PaginatedBase"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ProductListItem"

    PaginatedAdminProductList:
      allOf:
        - $ref: "#/components/schemas/PaginatedBase"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ProductDetail"

    # --- Cart & Wishlist (ADR-0012) ---------------------------------------
    CartProduct:
      type: object
      description: Current product data as seen by the customer (not a snapshot).
      required: [public_id, name, slug, price, effective_price, stock_quantity, is_in_stock]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        primary_image: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money" }
        discount_price: { type: [string, "null"] }
        effective_price: { $ref: "#/components/schemas/Money" }
        stock_quantity: { type: integer }
        is_in_stock: { type: boolean }

    CartAvailabilityStatus:
      type: string
      description: |
        Backend-computed line status:
        `available` — purchasable at the requested quantity;
        `insufficient_stock` — in stock but less than the requested quantity;
        `out_of_stock` — stock is 0;
        `unavailable` — product no longer storefront-eligible (draft/archived/hidden/inactive category).
      enum: [available, insufficient_stock, out_of_stock, unavailable]

    CartItem:
      type: object
      required: [product, quantity, unit_price, line_total, availability_status, is_purchasable]
      properties:
        product: { $ref: "#/components/schemas/CartProduct" }
        quantity: { type: integer, minimum: 1 }
        unit_price:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Current authoritative effective price (BR-02a, BR-10).
        line_total:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: unit_price × quantity, Decimal arithmetic, 2 fraction digits.
        availability_status: { $ref: "#/components/schemas/CartAvailabilityStatus" }
        is_purchasable:
          type: boolean
          description: true only when availability_status is `available`.
        added_at: { type: string, format: date-time }

    CartSummary:
      type: object
      description: |
        Authoritative totals. `subtotal` sums `line_total` of purchasable lines only.
        `total` equals `subtotal` until shipping/tax/discounts are introduced
        (checkout slice). `item_count` is the sum of quantities of all lines.
      required: [item_count, subtotal, total, currency, has_unavailable_items]
      properties:
        item_count: { type: integer, minimum: 0 }
        subtotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, examples: [USD] }
        has_unavailable_items: { type: boolean }

    Cart:
      allOf:
        - $ref: "#/components/schemas/CartSummary"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CartItem" }
            updated_at: { type: [string, "null"], format: date-time }

    CartItemCreateRequest:
      type: object
      required: [product_id]
      description: Ownership comes from the access token; any owner/price/total fields are ignored.
      properties:
        product_id: { type: string, format: uuid, description: Product public_id }
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: Quantity to ADD. Resulting line quantity must be ≤ 20 (BR-09) and ≤ stock.

    CartItemUpdateRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          description: New absolute line quantity (≤ 20 and ≤ stock). Use DELETE to remove.

    WishlistItem:
      type: object
      required: [product, is_available]
      properties:
        product: { $ref: "#/components/schemas/CartProduct" }
        is_available:
          type: boolean
          description: Product is storefront-eligible and in stock (can be added to cart now).
        added_at: { type: string, format: date-time }

    Wishlist:
      type: object
      required: [items, item_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WishlistItem" }
        item_count: { type: integer, minimum: 0 }

    WishlistItemCreateRequest:
      type: object
      required: [product_id]
      properties:
        product_id: { type: string, format: uuid, description: Product public_id }

    # --- Checkout & Orders (ADR-0013) -------------------------------------
    ShippingAddressInput:
      type: object
      required: [full_name, phone, address, city]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 255 }
        phone: { type: string, minLength: 7, maxLength: 50 }
        address: { type: string, minLength: 3, maxLength: 255 }
        city: { type: string, minLength: 2, maxLength: 100 }
        area: { type: string, maxLength: 100 }
        postal_code: { type: string, maxLength: 20 }
        country: { type: string, default: "Bangladesh", maxLength: 100 }

    OrderCreateRequest:
      type: object
      required: [shipping_address]
      properties:
        shipping_address:
          $ref: "#/components/schemas/ShippingAddressInput"
        customer_notes:
          type: string
          maxLength: 1000

    CheckoutCustomerSummary:
      type: object
      required: [email, full_name]
      properties:
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string }

    CheckoutPreview:
      type: object
      required: [cart, subtotal, shipping_cost, discount_total, total, currency, is_ready_for_checkout, customer]
      properties:
        cart:
          $ref: "#/components/schemas/Cart"
        subtotal:
          $ref: "#/components/schemas/Money"
        shipping_cost:
          $ref: "#/components/schemas/Money"
        discount_total:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: "USD"
        is_ready_for_checkout:
          type: boolean
        customer:
          $ref: "#/components/schemas/CheckoutCustomerSummary"

    OrderItemDetail:
      type: object
      required: [id, product_name, product_sku, unit_price, quantity, line_total]
      properties:
        id: { type: integer }
        product_public_id: { type: string, format: uuid, nullable: true }
        product_name: { type: string, description: Immutable name snapshot at purchase time }
        product_sku: { type: string, description: Immutable SKU snapshot at purchase time }
        product_image: { type: string, nullable: true, description: Immutable primary image URL snapshot }
        unit_price:
          $ref: "#/components/schemas/Money"
        quantity:
          type: integer
          minimum: 1
        line_total:
          $ref: "#/components/schemas/Money"

    OrderStatusHistoryItem:
      type: object
      required: [to_status, created_at]
      properties:
        from_status: { type: string }
        to_status: { type: string }
        actor_type:
          type: string
          enum: [system, staff, customer]
        reason: { type: string }
        created_at: { type: string, format: date-time }

    CustomerOrderListItem:
      type: object
      required: [public_id, order_number, status, payment_status, item_count, total, currency, created_at]
      properties:
        public_id: { type: string, format: uuid }
        order_number: { type: string }
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        payment_status:
          type: string
          enum: [pending, paid, failed, refunded]
        item_count: { type: integer }
        total:
          $ref: "#/components/schemas/Money"
        currency: { type: string }
        created_at: { type: string, format: date-time }

    PaginatedCustomerOrderList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/CustomerOrderListItem" }

    OrderDetail:
      type: object
      required: [public_id, order_number, status, payment_status, subtotal, shipping_cost, discount_total, total, currency, shipping_address, items, created_at]
      properties:
        public_id: { type: string, format: uuid }
        order_number: { type: string }
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        payment_status:
          type: string
          enum: [pending, paid, failed, refunded]
        subtotal:
          $ref: "#/components/schemas/Money"
        shipping_cost:
          $ref: "#/components/schemas/Money"
        discount_total:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        currency: { type: string }
        shipping_address:
          $ref: "#/components/schemas/ShippingAddressInput"
        customer_notes: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItemDetail" }
        status_history:
          type: array
          items: { $ref: "#/components/schemas/OrderStatusHistoryItem" }
        courier: { type: string, nullable: true }
        tracking_number: { type: string, nullable: true }
        tracking_url: { type: string, nullable: true }
        shipped_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminOrderListItem:
      allOf:
        - $ref: "#/components/schemas/CustomerOrderListItem"
        - type: object
          required: [customer_email, customer_name]
          properties:
            customer_email: { type: string }
            customer_name: { type: string }

    PaginatedAdminOrderList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/AdminOrderListItem" }

    AdminOrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderDetail"
        - type: object
          required: [customer]
          properties:
            customer:
              type: object
              required: [email, full_name]
              properties:
                public_id: { type: string, format: uuid }
                email: { type: string }
                full_name: { type: string }
                phone: { type: string }
            payment:
              $ref: "#/components/schemas/PaymentStatusResponse"

    PaymentInitiateRequest:
      type: object
      properties:
        gateway:
          type: string
          default: "sslcommerz"
        return_url:
          type: string

    PaymentInitiateResponse:
      type: object
      required: [payment_public_id, order_public_id, order_number, gateway, amount, currency, status, redirect_url]
      properties:
        payment_public_id: { type: string, format: uuid }
        order_public_id: { type: string, format: uuid }
        order_number: { type: string }
        gateway: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        status:
          type: string
          enum: [initiated, processing, paid, failed, cancelled]
        redirect_url: { type: string }
        provider_reference: { type: string }

    PaymentAttemptDetail:
      type: object
      required: [public_id, attempt_number, gateway, status, amount, currency, created_at]
      properties:
        public_id: { type: string, format: uuid }
        attempt_number: { type: integer }
        gateway: { type: string }
        status: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        provider_reference: { type: string }
        provider_transaction_id: { type: string }
        error_message: { type: string }
        created_at: { type: string, format: date-time }

    PaymentStatusResponse:
      type: object
      required: [order_public_id, order_number, status, amount, currency, gateway]
      properties:
        payment_public_id: { type: string, format: uuid, nullable: true }
        order_public_id: { type: string, format: uuid }
        order_number: { type: string }
        status:
          type: string
          enum: [pending, initiated, processing, paid, failed, cancelled, refunded]
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        gateway: { type: string }
        method: { type: string }
        provider_transaction_id: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/PaymentAttemptDetail" }

    PaymentWebhookResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [paid, already_paid, failed, rejected]
        message: { type: string }
        payment_public_id: { type: string, format: uuid }
        order_number: { type: string }

    OrderTransitionRequest:
      type: object
      required: [to_status]
      properties:
        to_status:
          type: string
          enum: [confirmed, processing, shipped, delivered, cancelled]
        reason:
          type: string
          description: Reason or note for transition
        courier:
          type: string
          description: Courier name (mandatory if to_status is shipped)
        tracking_number:
          type: string
          description: Tracking number (mandatory if to_status is shipped)
        tracking_url:
          type: string
          description: Optional tracking URL

    FulfillmentUpdateRequest:
      type: object
      properties:
        courier:
          type: string
        tracking_number:
          type: string
        tracking_url:
          type: string

    OrderCancelRequest:
      type: object
      properties:
        reason:
          type: string

    OrderTimelineItem:
      type: object
      required: [to_status, created_at]
      properties:
        from_status:
          type: string
        to_status:
          type: string
        actor_type:
          type: string
          enum: [system, staff, customer]
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    NotificationSummary:
      type: object
      required: [public_id, event_type, channel, recipient, status, created_at]
      properties:
        public_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum: [order_placed, payment_confirmed, order_processing, order_shipped, order_delivered, order_cancelled]
        channel:
          type: string
          enum: [email, sms]
        recipient:
          type: string
        status:
          type: string
          enum: [pending, sent, failed]
        created_at:
          type: string
          format: date-time

    StorefrontConfig:
      type: object
      required: [site_name, currency, version]
      properties:
        site_name: { type: string }
        currency: { type: string }
        version: { type: string }
        announcement_text: { type: string }
        meta_pixel_id: { type: string }
        ga4_measurement_id: { type: string }
        default_seo_title: { type: string }
        default_seo_description: { type: string }

    ContentBlock:
      type: object
      required: [public_id, title, slug, content_type, body, status, sort_order, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        content_type:
          type: string
          enum: [hero, banner, announcement, promotional_section, content_section]
        body: { type: string }
        image_url: { type: string }
        alt_text: { type: string }
        cta_label: { type: string }
        cta_url: { type: string }
        linked_product_id: { type: string, format: uuid, nullable: true }
        linked_category_slug: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, scheduled, published, archived]
        start_at: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContentBlockInput:
      type: object
      required: [title, slug, content_type]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        slug: { type: string, minLength: 1, maxLength: 255 }
        content_type:
          type: string
          enum: [hero, banner, announcement, promotional_section, content_section]
        body: { type: string }
        image_url: { type: string, maxLength: 500 }
        alt_text: { type: string, maxLength: 255 }
        cta_label: { type: string, maxLength: 100 }
        cta_url: { type: string, maxLength: 500 }
        linked_product_id: { type: string, format: uuid, nullable: true }
        linked_category_slug: { type: string, nullable: true }
        status:
          type: string
          enum: [draft, scheduled, published, archived]
        start_at: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }
        sort_order: { type: integer }

    StorefrontHomeContent:
      type: object
      properties:
        hero: { $ref: "#/components/schemas/ContentBlock", nullable: true }
        announcement: { $ref: "#/components/schemas/ContentBlock", nullable: true }
        banners:
          type: array
          items: { $ref: "#/components/schemas/ContentBlock" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ContentBlock" }

    Campaign:
      type: object
      required: [public_id, name, slug, status, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        badge_text: { type: string }
        status:
          type: string
          enum: [draft, active, archived]
        start_at: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CampaignInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        slug: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
        badge_text: { type: string, maxLength: 100 }
        status:
          type: string
          enum: [draft, active, archived]
        start_at: { type: string, format: date-time, nullable: true }
        end_at: { type: string, format: date-time, nullable: true }

    CommunicationPreference:
      type: object
      required: [marketing_email, marketing_sms, order_updates_email, updated_at]
      properties:
        marketing_email: { type: boolean }
        marketing_sms: { type: boolean }
        order_updates_email: { type: boolean }
        updated_at: { type: string, format: date-time }

    CommunicationPreferenceInput:
      type: object
      properties:
        marketing_email: { type: boolean }
        marketing_sms: { type: boolean }

    CustomerNotification:
      type: object
      required: [public_id, event_type, channel, status, subject, created_at]
      properties:
        public_id: { type: string, format: uuid }
        event_type: { type: string }
        channel: { type: string, enum: [email, sms] }
        status: { type: string, enum: [pending, sent, failed] }
        subject: { type: string }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }

    AdminNotification:
      type: object
      required: [public_id, recipient, event_type, channel, status, subject, attempt_count, created_at]
      properties:
        public_id: { type: string, format: uuid }
        recipient: { type: string }
        event_type: { type: string }
        channel: { type: string, enum: [email, sms] }
        status: { type: string, enum: [pending, sent, failed] }
        subject: { type: string }
        attempt_count: { type: integer }
        provider_message_id: { type: string }
        error_message: { type: string }
        order_number: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }

  responses:
    BadRequest:
      description: Validation error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication required or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Permission denied
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: State conflict (insufficient stock, invalid transition, stale update)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

security:
  - bearerAuth: []
