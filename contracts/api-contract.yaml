openapi: 3.1.0
info:
  title: Lumera API
  version: 0.3.0-draft
  description: |
    Contract structure (TASK-001 + CMS amendment). Only shared building blocks and
    the health endpoint are defined; business endpoints are added per feature task,
    contract-first. Conventions: architecture/api-architecture.md.

    Namespaces (ADR-0008, Proposed):
      /storefront/  public, read-mostly
      /auth/        customer authentication
      /customer/    authenticated customer, own data only
      /admin/       CMS operations; per-operation permission (x-required-permission)
      /internal/    machine callers (payment webhooks); not browser-facing
      /health/      monitoring
    Django Admin is NOT used; the custom Next.js CMS consumes /admin/.
servers:
  - url: http://localhost:8000/api/v1
    description: Development
  - url: https://staging.example.invalid/api/v1
    description: Staging (placeholder host)
  - url: https://example.invalid/api/v1
    description: Production (placeholder host)
tags:
  - name: system
  - name: storefront
    description: Public catalog, content, public config, tracking intake
  - name: auth
    description: Customer registration, login, refresh, logout
  - name: customer
    description: Authenticated customer APIs (own data only)
  - name: admin
    description: CMS APIs. Every operation declares x-required-permission.
  - name: admin-auth
    description: CMS login/refresh/logout/me (audience cms)
  - name: internal
    description: Webhooks and service-to-service callers

paths:
  /health/:
    get:
      tags: [system]
      summary: Liveness/readiness check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: Service unavailable (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/register/:
    post:
      tags: [auth]
      summary: Register a new customer account
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login/:
    post:
      tags: [auth]
      summary: Customer login
      operationId: loginCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh/:
    post:
      tags: [auth]
      summary: Refresh JWT access token
      operationId: refreshCustomerToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout/:
    post:
      tags: [auth]
      summary: Invalidate refresh token and logout
      operationId: logoutCustomer
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /customer/me/:
    get:
      tags: [customer]
      summary: Current authenticated customer profile
      operationId: getCustomerMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [customer]
      summary: Update permitted authenticated customer profile fields
      operationId: updateCustomerMe
      security:
        - bearerAuth: []
      description: Email, password, role, staff, activation, and authentication fields are not writable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfileUpdateRequest"
      responses:
        "200":
          description: Customer profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/addresses/:
    get:
      tags: [customer]
      summary: List the authenticated customer's saved addresses
      operationId: listCustomerAddresses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer-owned addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [customer]
      summary: Create a saved customer address
      operationId: createCustomerAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressInput"
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/addresses/{public_id}/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [customer]
      summary: Update a saved customer address
      operationId: updateCustomerAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerAddressUpdateRequest"
      responses:
        "200":
          description: Address updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAddress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [customer]
      summary: Delete a saved customer address
      operationId: deleteCustomerAddress
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Address deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Cart (ADR-0012, BR-07, BR-09, BR-10) ---------------------------------
  # Singleton per authenticated customer; ownership is derived from the access
  # token only. Prices/totals are recalculated from current Product data on
  # every read (no price snapshot until order placement, BR-03/BR-10).
  /customer/cart/:
    get:
      tags: [customer]
      summary: Retrieve the authenticated customer's cart with authoritative totals
      operationId: getCustomerCart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current cart (empty cart if the customer has no items)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [customer]
      summary: Clear (remove all items from) the authenticated customer's cart
      operationId: clearCustomerCart
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cart cleared (idempotent; also returned when already empty)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/cart/items/:
    post:
      tags: [customer]
      summary: Add a product to the cart (merges with an existing line)
      description: |
        If the product is already in the cart, the requested quantity is ADDED to
        the existing quantity and the resulting total is validated (one line per
        product; DB-unique (cart, product)). Only storefront-eligible products
        (BR-04) can be added; others are reported as 404. Any client-supplied
        price/total fields are ignored.
      operationId: addCustomerCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemCreateRequest"
      responses:
        "201":
          description: New cart line created; full updated cart returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "200":
          description: Existing cart line incremented; full updated cart returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resulting quantity exceeds available stock (code `insufficient_stock`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /customer/cart/items/{product_id}/:
    parameters:
      - $ref: "#/components/parameters/ProductPublicId"
    patch:
      tags: [customer]
      summary: Set the quantity of a cart line
      operationId: updateCustomerCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdateRequest"
      responses:
        "200":
          description: Quantity updated; full updated cart returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product is not in the authenticated customer's cart (code `not_found`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: |
            `insufficient_stock` — quantity exceeds available stock;
            `product_unavailable` — product is no longer storefront-eligible (remove it instead).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: [customer]
      summary: Remove a product line from the cart
      operationId: removeCustomerCartItem
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Line removed (idempotent; also returned when the product is not in the cart)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Wishlist (ADR-0012) --------------------------------------------------
  # Saved products only: no stock reservation, no price lock, no order effect.
  /customer/wishlist/:
    get:
      tags: [customer]
      summary: Retrieve the authenticated customer's wishlist
      operationId: getCustomerWishlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current wishlist (empty if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishlist"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/wishlist/items/:
    post:
      tags: [customer]
      summary: Add a product to the wishlist
      operationId: addCustomerWishlistItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistItemCreateRequest"
      responses:
        "201":
          description: Product saved; full updated wishlist returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Product is already in the wishlist (code `conflict`); wishlist unchanged
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /customer/wishlist/items/{product_id}/:
    parameters:
      - $ref: "#/components/parameters/ProductPublicId"
    delete:
      tags: [customer]
      summary: Remove a product from the wishlist
      operationId: removeCustomerWishlistItem
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed (idempotent; also returned when the product is not in the wishlist)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Checkout & Orders (ADR-0013, BR-03, BR-08, BR-11, BR-12, BR-12a) ------
  /customer/checkout/:
    get:
      tags: [customer]
      summary: Retrieve authoritative checkout preview before order placement
      description: |
        Returns customer cart items with current authoritative prices, stock eligibility,
        and required shipping fields. Does NOT reserve inventory or create an order.
      operationId: getCustomerCheckoutPreview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checkout preview details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/orders/:
    get:
      tags: [customer]
      summary: List authenticated customer's orders
      description: Returns a paginated list of orders placed by the authenticated customer.
      operationId: listCustomerOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomerOrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [customer]
      summary: Place order from current cart (transactional)
      description: |
        Validates cart items and stock with row locking (select_for_update), creates the Order,
        creates OrderItems with purchase-time price and product snapshots, deducts inventory stock,
        and clears the cart in a single atomic transaction.
      operationId: createCustomerOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Insufficient stock or product unavailable during checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customer/orders/{public_id}/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Order public_id (UUID)
    get:
      tags: [customer]
      summary: Retrieve authenticated customer's order detail
      description: |
        Returns order detail with historical snapshots. Customers can only retrieve their own orders.
      operationId: getCustomerOrderDetail
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order detail with purchase-time snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customer/orders/{public_id}/payment/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Order public_id (UUID)
    post:
      tags: [customer]
      summary: Initiate payment session for an order
      description: |
        Derives amount authoritatively from order total. Order must belong to authenticated customer and be payable.
      operationId: initiateOrderPayment
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitiateRequest"
      responses:
        "201":
          description: Payment session initiated; gateway redirect returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitiateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [customer]
      summary: Retrieve authoritative payment status for an order
      description: |
        Retrieves current payment status, provider transaction ID, and attempt history.
      operationId: getOrderPaymentStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authoritative payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /customer/orders/{public_id}/cancel/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Order public_id (UUID)
    post:
      tags: [customer]
      summary: Cancel customer's own unpaid pending order
      description: |
        Allows customer to cancel an order only if it is in pending status and unpaid.
        Restores reserved inventory and records status history.
      operationId: cancelCustomerOrder
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelRequest"
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /customer/orders/{public_id}/timeline/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Order public_id (UUID)
    get:
      tags: [customer]
      summary: Retrieve order status progression and audit timeline
      description: |
        Returns chronological status transitions, timestamps, and actor types for the authenticated customer's order.
      operationId: getCustomerOrderTimeline
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order status progression timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderTimelineItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/payments/webhook/{gateway}/:
    parameters:
      - name: gateway
        in: path
        required: true
        schema: { type: string }
        description: Payment gateway identifier (e.g. sslcommerz)
    post:
      tags: [internal]
      summary: Gateway webhook / IPN callback handler with server-side verification
      description: |
        Receives gateway callback, verifies authenticity via server-to-server gateway query,
        and idempotently updates payment and order state.
      operationId: processPaymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
          application/x-www-form-urlencoded:
            schema: { type: object }
      responses:
        "200":
          description: Callback verified and processed (or idempotent duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWebhookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/auth/login/:
    post:
      tags: [admin-auth]
      summary: Staff CMS login
      operationId: loginStaff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Staff login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/auth/refresh/:
    post:
      tags: [admin-auth]
      summary: Refresh CMS staff JWT access token
      operationId: refreshStaffToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/logout/:
    post:
      tags: [admin-auth]
      summary: Invalidate staff refresh token
      operationId: logoutStaff
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /admin/auth/me/:
    get:
      tags: [admin-auth]
      summary: Current staff profile and permissions
      operationId: getStaffMe
      security:
        - cmsBearerAuth: []
      responses:
        "200":
          description: Staff profile and advisory permissions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /storefront/categories/:
    get:
      tags: [storefront]
      summary: List all active categories
      operationId: getStorefrontCategories
      security: []
      responses:
        "200":
          description: List of active categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /storefront/categories/{slug}/:
    get:
      tags: [storefront]
      summary: Retrieve an active category by slug
      operationId: getStorefrontCategory
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active category detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"

  /storefront/products/:
    get:
      tags: [storefront]
      summary: List active, visible products
      operationId: getStorefrontProducts
      security: []
      parameters:
        - name: category
          in: query
          description: Filter by category slug
          schema: { type: string }
        - name: ordering
          in: query
          description: Ordering (e.g. price, -price, created_at, -created_at)
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated active products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductList"

  /storefront/products/{slug}/:
    get:
      tags: [storefront]
      summary: Retrieve an active, visible product by slug
      operationId: getStorefrontProduct
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active product detail with images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /storefront/config/:
    get:
      tags: [storefront]
      summary: Public safe configuration and tracking metadata
      operationId: getStorefrontConfig
      security: []
      responses:
        "200":
          description: Safe public storefront configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontConfig"

  /storefront/content/home/:
    get:
      tags: [storefront]
      summary: Retrieve active homepage content blocks
      operationId: getStorefrontHomeContent
      security: []
      responses:
        "200":
          description: Active homepage hero, announcement, banners, and sections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorefrontHomeContent"

