openapi: 3.1.0
info:
  title: Lumera API
  version: 0.3.0-draft
  description: |
    Contract structure (TASK-001 + CMS amendment). Only shared building blocks and
    the health endpoint are defined; business endpoints are added per feature task,
    contract-first. Conventions: architecture/api-architecture.md.

    Namespaces (ADR-0008, Proposed):
      /storefront/  public, read-mostly
      /auth/        customer authentication
      /customer/    authenticated customer, own data only
      /admin/       CMS operations; per-operation permission (x-required-permission)
      /internal/    machine callers (payment webhooks); not browser-facing
      /health/      monitoring
    Django Admin is NOT used; the custom Next.js CMS consumes /admin/.
servers:
  - url: http://localhost:8000/api/v1
    description: Development
  - url: https://staging.example.invalid/api/v1
    description: Staging (placeholder host)
  - url: https://example.invalid/api/v1
    description: Production (placeholder host)
tags:
  - name: system
  - name: storefront
    description: Public catalog, content, public config, tracking intake
  - name: auth
    description: Customer registration, login, refresh, logout
  - name: customer
    description: Authenticated customer APIs (own data only)
  - name: admin
    description: CMS APIs. Every operation declares x-required-permission.
  - name: admin-auth
    description: CMS login/refresh/logout/me (audience cms)
  - name: internal
    description: Webhooks and service-to-service callers

paths:
  /health/:
    get:
      tags: [system]
      summary: Liveness/readiness check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: Service unavailable (e.g. database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/register/:
    post:
      tags: [auth]
      summary: Register a new customer account
      operationId: registerCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login/:
    post:
      tags: [auth]
      summary: Customer login
      operationId: loginCustomer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh/:
    post:
      tags: [auth]
      summary: Refresh JWT access token
      operationId: refreshCustomerToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout/:
    post:
      tags: [auth]
      summary: Invalidate refresh token and logout
      operationId: logoutCustomer
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /customer/me/:
    get:
      tags: [customer]
      summary: Current authenticated customer profile
      operationId: getCustomerMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Cart (ADR-0012, BR-07, BR-09, BR-10) ---------------------------------
  # Singleton per authenticated customer; ownership is derived from the access
  # token only. Prices/totals are recalculated from current Product data on
  # every read (no price snapshot until order placement, BR-03/BR-10).
  /customer/cart/:
    get:
      tags: [customer]
      summary: Retrieve the authenticated customer's cart with authoritative totals
      operationId: getCustomerCart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current cart (empty cart if the customer has no items)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [customer]
      summary: Clear (remove all items from) the authenticated customer's cart
      operationId: clearCustomerCart
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cart cleared (idempotent; also returned when already empty)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/cart/items/:
    post:
      tags: [customer]
      summary: Add a product to the cart (merges with an existing line)
      description: |
        If the product is already in the cart, the requested quantity is ADDED to
        the existing quantity and the resulting total is validated (one line per
        product; DB-unique (cart, product)). Only storefront-eligible products
        (BR-04) can be added; others are reported as 404. Any client-supplied
        price/total fields are ignored.
      operationId: addCustomerCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemCreateRequest"
      responses:
        "201":
          description: New cart line created; full updated cart returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "200":
          description: Existing cart line incremented; full updated cart returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Resulting quantity exceeds available stock (code `insufficient_stock`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /customer/cart/items/{product_id}/:
    parameters:
      - $ref: "#/components/parameters/ProductPublicId"
    patch:
      tags: [customer]
      summary: Set the quantity of a cart line
      operationId: updateCustomerCartItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdateRequest"
      responses:
        "200":
          description: Quantity updated; full updated cart returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product is not in the authenticated customer's cart (code `not_found`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: |
            `insufficient_stock` — quantity exceeds available stock;
            `product_unavailable` — product is no longer storefront-eligible (remove it instead).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: [customer]
      summary: Remove a product line from the cart
      operationId: removeCustomerCartItem
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Line removed (idempotent; also returned when the product is not in the cart)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Wishlist (ADR-0012) --------------------------------------------------
  # Saved products only: no stock reservation, no price lock, no order effect.
  /customer/wishlist/:
    get:
      tags: [customer]
      summary: Retrieve the authenticated customer's wishlist
      operationId: getCustomerWishlist
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current wishlist (empty if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishlist"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/wishlist/items/:
    post:
      tags: [customer]
      summary: Add a product to the wishlist
      operationId: addCustomerWishlistItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistItemCreateRequest"
      responses:
        "201":
          description: Product saved; full updated wishlist returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wishlist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Product is already in the wishlist (code `conflict`); wishlist unchanged
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /customer/wishlist/items/{product_id}/:
    parameters:
      - $ref: "#/components/parameters/ProductPublicId"
    delete:
      tags: [customer]
      summary: Remove a product from the wishlist
      operationId: removeCustomerWishlistItem
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed (idempotent; also returned when the product is not in the wishlist)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Checkout & Orders (ADR-0013, BR-03, BR-08, BR-11, BR-12, BR-12a) ------
  /customer/checkout/:
    get:
      tags: [customer]
      summary: Retrieve authoritative checkout preview before order placement
      description: |
        Returns customer cart items with current authoritative prices, stock eligibility,
        and required shipping fields. Does NOT reserve inventory or create an order.
      operationId: getCustomerCheckoutPreview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Checkout preview details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /customer/orders/:
    get:
      tags: [customer]
      summary: List authenticated customer's orders
      description: Returns a paginated list of orders placed by the authenticated customer.
      operationId: listCustomerOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomerOrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [customer]
      summary: Place order from current cart (transactional)
      description: |
        Validates cart items and stock with row locking (select_for_update), creates the Order,
        creates OrderItems with purchase-time price and product snapshots, deducts inventory stock,
        and clears the cart in a single atomic transaction.
      operationId: createCustomerOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Insufficient stock or product unavailable during checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /customer/orders/{public_id}/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Order public_id (UUID)
    get:
      tags: [customer]
      summary: Retrieve authenticated customer's order detail
      description: |
        Returns order detail with historical snapshots. Customers can only retrieve their own orders.
      operationId: getCustomerOrderDetail
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Order detail with purchase-time snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/auth/login/:
    post:
      tags: [admin-auth]
      summary: Staff CMS login
      operationId: loginStaff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Staff login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/auth/refresh/:
    post:
      tags: [admin-auth]
      summary: Refresh CMS staff JWT access token
      operationId: refreshStaffToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/auth/logout/:
    post:
      tags: [admin-auth]
      summary: Invalidate staff refresh token
      operationId: logoutStaff
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /admin/auth/me/:
    get:
      tags: [admin-auth]
      summary: Current staff profile and permissions
      operationId: getStaffMe
      security:
        - cmsBearerAuth: []
      responses:
        "200":
          description: Staff profile and advisory permissions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /storefront/categories/:
    get:
      tags: [storefront]
      summary: List all active categories
      operationId: getStorefrontCategories
      security: []
      responses:
        "200":
          description: List of active categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /storefront/categories/{slug}/:
    get:
      tags: [storefront]
      summary: Retrieve an active category by slug
      operationId: getStorefrontCategory
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active category detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"

  /storefront/products/:
    get:
      tags: [storefront]
      summary: List active, visible products
      operationId: getStorefrontProducts
      security: []
      parameters:
        - name: category
          in: query
          description: Filter by category slug
          schema: { type: string }
        - name: ordering
          in: query
          description: Ordering (e.g. price, -price, created_at, -created_at)
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated active products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductList"

  /storefront/products/{slug}/:
    get:
      tags: [storefront]
      summary: Retrieve an active, visible product by slug
      operationId: getStorefrontProduct
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active product detail with images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/categories/:
    get:
      tags: [admin]
      summary: List all categories for CMS management
      operationId: getAdminCategories
      security:
        - cmsBearerAuth: []
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Create a category
      operationId: createAdminCategory
      security:
        - cmsBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateUpdateRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/categories/{id}/:
    get:
      tags: [admin]
      summary: Get category detail by ID or slug
      operationId: getAdminCategory
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Category detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Full update of category
      operationId: updateAdminCategory
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateUpdateRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Partial update of category
      operationId: patchAdminCategory
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateUpdateRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Archive or delete category
      operationId: deleteAdminCategory
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Category deleted/archived
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/products/:
    get:
      tags: [admin]
      summary: List all products for CMS management
      operationId: getAdminProducts
      security:
        - cmsBearerAuth: []
      parameters:
        - name: category_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - name: search
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated admin product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAdminProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      summary: Create a product
      operationId: createAdminProduct
      security:
        - cmsBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateUpdateRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/products/{id}/:
    get:
      tags: [admin]
      summary: Get product details by ID or slug
      operationId: getAdminProduct
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [admin]
      summary: Full update of product
      operationId: updateAdminProduct
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateUpdateRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Partial update of product
      operationId: patchAdminProduct
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateUpdateRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      summary: Archive or delete product
      operationId: deleteAdminProduct
      security:
        - cmsBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Product deleted/archived
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Admin Orders (ADR-0013, CMS Visibility) -------------------------------
  /admin/orders/:
    get:
      tags: [admin]
      summary: List all orders for CMS staff
      description: Operational order listing with status, payment status, customer, and search filters.
      operationId: listAdminOrders
      security:
        - cmsBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, confirmed, processing, shipped, delivered, cancelled] }
        - name: payment_status
          in: query
          required: false
          schema: { type: string, enum: [pending, paid, failed, refunded] }
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Search by order_number or customer email
      responses:
        "200":
          description: Paginated admin order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAdminOrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/orders/{public_id}/:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Order public_id (UUID)
    get:
      tags: [admin]
      summary: Retrieve order detail for CMS staff
      description: Full operational order detail including snapshots, customer info, and status history.
      operationId: getAdminOrderDetail
      security:
        - cmsBearerAuth: []
      responses:
        "200":
          description: Admin order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Customer access token (audience storefront). Proposed in ADR-0003 (pending approval).
    cmsBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: CMS access token (audience cms). Accepted only under /admin/. Proposed in ADR-0009 (pending approval). Authorization is by permission, resolved server-side.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Provider-specific signature verification for /internal/ webhooks (details per provider, ADR-0005).

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Ordering:
      name: ordering
      in: query
      description: Field name; prefix with `-` for descending. Allowed fields are defined per endpoint.
      schema: { type: string }
    Search:
      name: search
      in: query
      schema: { type: string }
    ProductPublicId:
      name: product_id
      in: path
      required: true
      description: Product `public_id` (UUID). A malformed value yields the canonical JSON 404.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      description: Optimistic concurrency token (ETag / updated_at) for admin updates; stale value yields 409 conflict.
      schema: { type: string }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              examples: [validation_error, not_authenticated, permission_denied, not_found, conflict, insufficient_stock, product_unavailable, invalid_state_transition, throttled]
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    PaginatedBase:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer }
        next: { type: [string, "null"], format: uri }
        previous: { type: [string, "null"], format: uri }
        results: { type: array, items: {} }
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Decimal amount as string, 2 fraction digits.
      examples: ["19.90"]
    SecretFieldStatus:
      type: object
      description: Representation of a secret configuration value in ANY response. The value is never returned.
      required: [is_set]
      properties:
        is_set: { type: boolean }
        updated_at: { type: [string, "null"], format: date-time }
    PermissionList:
      type: array
      description: Permission codes (resource.action), e.g. products.write. Advisory for UI gating; the backend re-checks every request.
      items: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' }
    User:
      type: object
      required: [id, email, is_active, is_staff]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        is_active: { type: boolean }
        is_staff: { type: boolean }
        created_at: { type: string, format: date-time }

    StaffUser:
      type: object
      required: [id, email, is_staff, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        is_staff: { type: boolean }
        permissions: { $ref: "#/components/schemas/PermissionList" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access: { type: string }
        refresh: { type: string }
        user: { $ref: "#/components/schemas/User" }

    StaffAuthResponse:
      type: object
      required: [access, refresh, user]
      properties:
        access: { type: string }
        refresh: { type: string }
        user: { $ref: "#/components/schemas/StaffUser" }

    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh: { type: string }

    TokenRefreshResponse:
      type: object
      required: [access]
      properties:
        access: { type: string }
        refresh: { type: string }

    LogoutRequest:
      type: object
      properties:
        refresh: { type: string }

    TrackingEvent:
      type: object
      description: Provider-neutral tracking event (ADR-0010). Client-sent events are non-authoritative.
      required: [event_id, event_name]
      properties:
        event_id: { type: string, format: uuid, description: Used for browser/server deduplication }
        event_name:
          type: string
          enum: [view_content, view_category, search, add_to_cart, remove_from_cart, initiate_checkout, add_payment_info, sign_up]
    Category:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image_url: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        sort_order: { type: integer }
        seo_title: { type: string }
        seo_description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoryCreateUpdateRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        image_url: { type: string }
        status: { type: string, enum: [draft, active, archived], default: active }
        sort_order: { type: integer, default: 0 }
        seo_title: { type: string }
        seo_description: { type: string }

    ProductImage:
      type: object
      required: [id, image_url, is_primary]
      properties:
        id: { type: integer }
        image_url: { type: string }
        alt_text: { type: string }
        sort_order: { type: integer }
        is_primary: { type: boolean }

    ProductListItem:
      type: object
      required: [id, public_id, name, slug, sku, category, price, effective_price, stock_quantity, is_in_stock, status, is_visible]
      properties:
        id: { type: integer }
        public_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        category:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        discount_price: { type: [string, "null"] }
        effective_price: { $ref: "#/components/schemas/Money" }
        stock_quantity: { type: integer }
        is_in_stock: { type: boolean }
        status: { type: string, enum: [draft, active, archived] }
        is_visible: { type: boolean }
        is_featured: { type: boolean }
        sort_order: { type: integer }
        primary_image: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductListItem"
        - type: object
          properties:
            description: { type: string }
            seo_title: { type: string }
            seo_description: { type: string }
            images:
              type: array
              items:
                $ref: "#/components/schemas/ProductImage"
            updated_at: { type: string, format: date-time }

    ProductCreateUpdateRequest:
      type: object
      required: [name, slug, sku, category_id, price]
      properties:
        name: { type: string }
        slug: { type: string }
        sku: { type: string }
        category_id: { type: integer }
        description: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        discount_price: { type: [string, "null"] }
        stock_quantity: { type: integer, minimum: 0, default: 0 }
        status: { type: string, enum: [draft, active, archived], default: draft }
        is_visible: { type: boolean, default: true }
        is_featured: { type: boolean, default: false }
        sort_order: { type: integer, default: 0 }
        seo_title: { type: string }
        seo_description: { type: string }
        images:
          type: array
          items:
            type: object
            required: [image_url]
            properties:
              image_url: { type: string }
              alt_text: { type: string }
              sort_order: { type: integer }
              is_primary: { type: boolean }

    PaginatedProductList:
      allOf:
        - $ref: "#/components/schemas/PaginatedBase"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ProductListItem"

    PaginatedAdminProductList:
      allOf:
        - $ref: "#/components/schemas/PaginatedBase"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/ProductDetail"

    # --- Cart & Wishlist (ADR-0012) ---------------------------------------
    CartProduct:
      type: object
      description: Current product data as seen by the customer (not a snapshot).
      required: [public_id, name, slug, price, effective_price, stock_quantity, is_in_stock]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        primary_image: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money" }
        discount_price: { type: [string, "null"] }
        effective_price: { $ref: "#/components/schemas/Money" }
        stock_quantity: { type: integer }
        is_in_stock: { type: boolean }

    CartAvailabilityStatus:
      type: string
      description: |
        Backend-computed line status:
        `available` — purchasable at the requested quantity;
        `insufficient_stock` — in stock but less than the requested quantity;
        `out_of_stock` — stock is 0;
        `unavailable` — product no longer storefront-eligible (draft/archived/hidden/inactive category).
      enum: [available, insufficient_stock, out_of_stock, unavailable]

    CartItem:
      type: object
      required: [product, quantity, unit_price, line_total, availability_status, is_purchasable]
      properties:
        product: { $ref: "#/components/schemas/CartProduct" }
        quantity: { type: integer, minimum: 1 }
        unit_price:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Current authoritative effective price (BR-02a, BR-10).
        line_total:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: unit_price × quantity, Decimal arithmetic, 2 fraction digits.
        availability_status: { $ref: "#/components/schemas/CartAvailabilityStatus" }
        is_purchasable:
          type: boolean
          description: true only when availability_status is `available`.
        added_at: { type: string, format: date-time }

    CartSummary:
      type: object
      description: |
        Authoritative totals. `subtotal` sums `line_total` of purchasable lines only.
        `total` equals `subtotal` until shipping/tax/discounts are introduced
        (checkout slice). `item_count` is the sum of quantities of all lines.
      required: [item_count, subtotal, total, currency, has_unavailable_items]
      properties:
        item_count: { type: integer, minimum: 0 }
        subtotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, examples: [USD] }
        has_unavailable_items: { type: boolean }

    Cart:
      allOf:
        - $ref: "#/components/schemas/CartSummary"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CartItem" }
            updated_at: { type: [string, "null"], format: date-time }

    CartItemCreateRequest:
      type: object
      required: [product_id]
      description: Ownership comes from the access token; any owner/price/total fields are ignored.
      properties:
        product_id: { type: string, format: uuid, description: Product public_id }
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: Quantity to ADD. Resulting line quantity must be ≤ 20 (BR-09) and ≤ stock.

    CartItemUpdateRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          description: New absolute line quantity (≤ 20 and ≤ stock). Use DELETE to remove.

    WishlistItem:
      type: object
      required: [product, is_available]
      properties:
        product: { $ref: "#/components/schemas/CartProduct" }
        is_available:
          type: boolean
          description: Product is storefront-eligible and in stock (can be added to cart now).
        added_at: { type: string, format: date-time }

    Wishlist:
      type: object
      required: [items, item_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WishlistItem" }
        item_count: { type: integer, minimum: 0 }

    WishlistItemCreateRequest:
      type: object
      required: [product_id]
      properties:
        product_id: { type: string, format: uuid, description: Product public_id }

    # --- Checkout & Orders (ADR-0013) -------------------------------------
    ShippingAddressInput:
      type: object
      required: [full_name, phone, address, city]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 255 }
        phone: { type: string, minLength: 7, maxLength: 50 }
        address: { type: string, minLength: 3, maxLength: 255 }
        city: { type: string, minLength: 2, maxLength: 100 }
        area: { type: string, maxLength: 100 }
        postal_code: { type: string, maxLength: 20 }
        country: { type: string, default: "Bangladesh", maxLength: 100 }

    OrderCreateRequest:
      type: object
      required: [shipping_address]
      properties:
        shipping_address:
          $ref: "#/components/schemas/ShippingAddressInput"
        customer_notes:
          type: string
          maxLength: 1000

    CheckoutCustomerSummary:
      type: object
      required: [email, full_name]
      properties:
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string }

    CheckoutPreview:
      type: object
      required: [cart, subtotal, shipping_cost, discount_total, total, currency, is_ready_for_checkout, customer]
      properties:
        cart:
          $ref: "#/components/schemas/Cart"
        subtotal:
          $ref: "#/components/schemas/Money"
        shipping_cost:
          $ref: "#/components/schemas/Money"
        discount_total:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        currency:
          type: string
          default: "USD"
        is_ready_for_checkout:
          type: boolean
        customer:
          $ref: "#/components/schemas/CheckoutCustomerSummary"

    OrderItemDetail:
      type: object
      required: [id, product_name, product_sku, unit_price, quantity, line_total]
      properties:
        id: { type: integer }
        product_public_id: { type: string, format: uuid, nullable: true }
        product_name: { type: string, description: Immutable name snapshot at purchase time }
        product_sku: { type: string, description: Immutable SKU snapshot at purchase time }
        product_image: { type: string, nullable: true, description: Immutable primary image URL snapshot }
        unit_price:
          $ref: "#/components/schemas/Money"
        quantity:
          type: integer
          minimum: 1
        line_total:
          $ref: "#/components/schemas/Money"

    OrderStatusHistoryItem:
      type: object
      required: [to_status, created_at]
      properties:
        from_status: { type: string }
        to_status: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }

    CustomerOrderListItem:
      type: object
      required: [public_id, order_number, status, payment_status, item_count, total, currency, created_at]
      properties:
        public_id: { type: string, format: uuid }
        order_number: { type: string }
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        payment_status:
          type: string
          enum: [pending, paid, failed, refunded]
        item_count: { type: integer }
        total:
          $ref: "#/components/schemas/Money"
        currency: { type: string }
        created_at: { type: string, format: date-time }

    PaginatedCustomerOrderList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/CustomerOrderListItem" }

    OrderDetail:
      type: object
      required: [public_id, order_number, status, payment_status, subtotal, shipping_cost, discount_total, total, currency, shipping_address, items, created_at]
      properties:
        public_id: { type: string, format: uuid }
        order_number: { type: string }
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]
        payment_status:
          type: string
          enum: [pending, paid, failed, refunded]
        subtotal:
          $ref: "#/components/schemas/Money"
        shipping_cost:
          $ref: "#/components/schemas/Money"
        discount_total:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        currency: { type: string }
        shipping_address:
          $ref: "#/components/schemas/ShippingAddressInput"
        customer_notes: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItemDetail" }
        status_history:
          type: array
          items: { $ref: "#/components/schemas/OrderStatusHistoryItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminOrderListItem:
      allOf:
        - $ref: "#/components/schemas/CustomerOrderListItem"
        - type: object
          required: [customer_email, customer_name]
          properties:
            customer_email: { type: string }
            customer_name: { type: string }

    PaginatedAdminOrderList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: "#/components/schemas/AdminOrderListItem" }

    AdminOrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderDetail"
        - type: object
          required: [customer]
          properties:
            customer:
              type: object
              required: [email, full_name]
              properties:
                public_id: { type: string, format: uuid }
                email: { type: string }
                full_name: { type: string }
                phone: { type: string }

  responses:
    BadRequest:
      description: Validation error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication required or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Permission denied
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: State conflict (insufficient stock, invalid transition, stale update)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

security:
  - bearerAuth: []
